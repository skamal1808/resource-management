[package]
name = "team-compliance-tracker"
version = "2.0.0"
description = "Native Windows & macOS Team Resource and Compliance Tracker"
authors = ["VMG & Associates"]
edition = "2021"

[lib]
name = "team_compliance_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
